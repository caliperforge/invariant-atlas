# Atlas case 6 — CLEAN twin Foundry config.
#
# Byte-identical between cases/06-evm-access-control/clean/ and
# cases/06-evm-access-control/planted/. Only src/AccessControlledForge.sol
# differs between the two twins; the toolchain config and the test surface
# do not change.
#
# Tracks chimera-template-pack conventions: solc 0.8.28, forge-std v1.9.4,
# invariant runner sized for CI-friendly campaigns. The Atlas's CI workflow
# installs forge-std via `forge install foundry-rs/forge-std@v1.9.4 --no-git`
# before `forge build` — matching case 1's no-lockfile-committed pattern
# (cf-invariants references do not commit Scarb.lock; the Atlas does not
# commit lib/forge-std for the same reproducibility reason).

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "forge-std/=lib/forge-std/src/",
]

ffi = false
gas_limit = 9223372036854775807
memory_limit = 2147483648

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 50
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true
