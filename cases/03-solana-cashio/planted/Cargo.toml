[workspace]
resolver = "2"
members = [
    "programs/cashio-mint",
    "tests",
]

# Mirrors the cf-invariants-pyth / cf-invariants-jito release profile;
# the BPF program is the only build artifact that matters and we want
# overflow-checks on in release because the bug class itself sits next
# to integer-counter increments.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
