name: atlas-all

# Top-level Atlas CI. Per case, the workflow asserts BOTH legs
# explicitly (the paired-leg pattern that upgrades cf-invariants'
# `planted >= 1` single-leg pattern, per the v0.1 spec §4.3):
#
#   clean-passes:
#     - run the case's invariant suite against the CLEAN reference
#     - assert: zero property violations (within timeout)
#     - exit code zero AND no `INVARIANT VIOLATED` marker
#   planted-bug-twin-fails:
#     - run the same suite against the PLANTED-BUG twin
#     - assert: ≥1 violation within timeout
#     - exit code non-zero AND the marker present on stdout
#
# The matrix is per-case × per-leg. Every case ships a `clean/` and a
# `planted/` Scarb project under cases/<n>-<vm>-<protocol>/; the matrix
# walks every case and asserts both legs in parallel.
#
# Pinned toolchain (matches cases/01-cairo-zklend's, case 2's, case
# 5's, + case 6's READMEs):
#   - scarb:               2.18.0
#   - starknet-foundry:    0.61.0  (snforge_std 0.61.0; 0.60.0 also OK)
#   - sui CLI:             mainnet-v1.72.5
#   - Move edition:        2024  (pinned in each case's Move.toml)
#   - foundry:             stable channel (forge-rs/foundry-toolchain@v1)
#   - forge-std:           v1.9.4 (matches chimera-template-pack pin)
#   - rust:                1.89.0 (min required by solana-address/hash/pubkey
#                                  2.x+; bumped from 1.79.0)
#   - anchor-lang:         1.0.1 (matches cf-invariants-anchor + the
#                                  Jito ports' workspace pin)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  # Reusable: nightly.yml calls this via `uses:`; that needs workflow_call.
  workflow_call: {}
  schedule:
    # Weekly maintenance probe. A green badge here means "passes on
    # today's toolchain", not "passed when we last pushed". Staggered
    # across the public fleet to avoid hammering the GHA runner pool.
    - cron: '21 6 * * 1'

concurrency:
  group: atlas-all-${{ github.ref }}
  cancel-in-progress: true

env:
  SCARB_VERSION: '2.18.0'
  SNFORGE_VERSION: '0.61.0'
  SUI_VERSION: 'mainnet-v1.72.5'
  FORGE_STD_VERSION: 'v1.9.4'
  # Solana / Anchor (case 5 Loopscale onward). Bumped to 1.89.0
  # (from 1.79.0): solana-address/hash/pubkey 2.x+ require >= 1.89.0.
  # Bump only alongside a full local re-run of the case's clean + planted legs.
  RUST_VERSION: '1.89.0'

jobs:
  cairo-cases:
    name: Atlas case (Cairo) — ${{ matrix.case }} / ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every Cairo case lists itself here. Case 1 (zkLend) is the
        # template-setter; subsequent Cairo cases (none in v0.1; v0.2
        # candidates per spec §2.4) append here without restructuring.
        case:
          - 01-cairo-zklend
        leg:
          - clean
          - planted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cairo
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
          snforge-version: ${{ env.SNFORGE_VERSION }}

      - name: scarb build (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          scarb build
          ls -l target/dev/

      - name: snforge test (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          OUT="$GITHUB_WORKSPACE/ci-out/${{ matrix.case }}-${{ matrix.leg }}.out"
          snforge test 2>&1 | tee "$OUT"
          rc=${PIPESTATUS[0]}
          set -e
          MARKER_COUNT=$(grep -c -E 'INVARIANT VIOLATED' "$OUT" || true)
          if [ "${{ matrix.leg }}" = "planted" ]; then
            # Planted: rc != 0 AND marker present. Either condition
            # missing means the planted bug failed to surface or
            # snforge's exit-code contract changed.
            if [ "$MARKER_COUNT" -ge 1 ] && [ "$rc" -ne 0 ]; then
              echo "::notice::${{ matrix.case }} planted leg fired as expected (rc=${rc}, markers=${MARKER_COUNT})."
              exit 0
            fi
            echo "::error::${{ matrix.case }} planted leg regressed (rc=${rc}, markers=${MARKER_COUNT}); expected rc!=0 AND markers>=1."
            exit 1
          else
            # Clean: rc == 0 AND zero markers. Either an invariant
            # violation here OR a non-zero rc (compile error, driver
            # revert, anything else) fails the clean leg loud.
            if [ "$MARKER_COUNT" -eq 0 ] && [ "$rc" -eq 0 ]; then
              echo "::notice::${{ matrix.case }} clean leg holds (rc=0, 0 markers)."
              exit 0
            fi
            echo "::error::${{ matrix.case }} clean leg failed (rc=${rc}, markers=${MARKER_COUNT}); expected rc==0 AND markers==0."
            exit 1
          fi

      - name: Upload snforge raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snforge-out-${{ matrix.case }}-${{ matrix.leg }}
          path: ci-out/${{ matrix.case }}-${{ matrix.leg }}.out

  move-cases:
    name: Atlas case (Move / Sui) — ${{ matrix.case }} / ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every Move / Sui case lists itself here. Case 2 (Cetus) is the
        # Move template-setter for the Atlas; subsequent Move cases
        # append here without restructuring.
        case:
          - 02-move-cetus
        leg:
          - clean
          - planted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sui
        with:
          sui-version: ${{ env.SUI_VERSION }}

      - name: sui move build (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          sui move build
          ls -l build/

      - name: sui move test (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          OUT="$GITHUB_WORKSPACE/ci-out/${{ matrix.case }}-${{ matrix.leg }}.out"
          sui move test 2>&1 | tee "$OUT"
          rc=${PIPESTATUS[0]}
          set -e
          MARKER_COUNT=$(grep -c -E 'INVARIANT VIOLATED' "$OUT" || true)
          if [ "${{ matrix.leg }}" = "planted" ]; then
            # Planted: rc != 0 AND marker present. Either condition
            # missing means the planted bug failed to surface or the
            # `sui move test` exit-code contract changed.
            if [ "$MARKER_COUNT" -ge 1 ] && [ "$rc" -ne 0 ]; then
              echo "::notice::${{ matrix.case }} planted leg fired as expected (rc=${rc}, markers=${MARKER_COUNT})."
              exit 0
            fi
            echo "::error::${{ matrix.case }} planted leg regressed (rc=${rc}, markers=${MARKER_COUNT}); expected rc!=0 AND markers>=1."
            exit 1
          else
            # Clean: rc == 0 AND zero markers.
            if [ "$MARKER_COUNT" -eq 0 ] && [ "$rc" -eq 0 ]; then
              echo "::notice::${{ matrix.case }} clean leg holds (rc=0, 0 markers)."
              exit 0
            fi
            echo "::error::${{ matrix.case }} clean leg failed (rc=${rc}, markers=${MARKER_COUNT}); expected rc==0 AND markers==0."
            exit 1
          fi

      - name: Upload sui move test raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sui-move-out-${{ matrix.case }}-${{ matrix.leg }}
          path: ci-out/${{ matrix.case }}-${{ matrix.leg }}.out

  evm-cases:
    name: Atlas case (EVM) — ${{ matrix.case }} / ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every EVM case lists itself here. Case 6 is the Trace2Inv-bridge
        # access-control case (the canon hand-shake, NOT a competitive
        # entry — see cases/06-evm-access-control/README.md §1). Case 8
        # covers Guardian audit M-01 on Ethena TimelockController
        # (selector-extraction integrity — 2025-05-26 Medium; see
        # cases/08-evm-ethena-timelock-selector/README.md). Case 8 also
        # requires OpenZeppelin v5 as an install-at-CI-time dep (the
        # vendored Guardian contract inherits OZ v5's TimelockController).
        case:
          - 06-evm-access-control
          - 08-evm-ethena-timelock-selector
        leg:
          - clean
          - planted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-foundry
        with:
          forge-std-version: ${{ env.FORGE_STD_VERSION }}

      - name: Install forge-std (${{ env.FORGE_STD_VERSION }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          # `--no-git` installs the dep as plain files rather than a git
          # submodule (each case dir is not its own git root — it's a
          # subdir of the actions/checkout-cloned tree). This matches the
          # local-reproduction command in the case README and works under
          # foundry >= 1.0.
          forge install foundry-rs/forge-std@${{ env.FORGE_STD_VERSION }} --no-git

      - name: Install openzeppelin-contracts v5.0.2 (case 8 only)
        if: matrix.case == '08-evm-ethena-timelock-selector'
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          # Case 8 subclasses Guardian's vendored EthenaTimelockController
          # (lib/ethena-timelock-defender/src/EthenaTimelockController.sol),
          # which imports @openzeppelin/contracts/governance/TimelockController.sol
          # and @openzeppelin/contracts/utils/ReentrancyGuard.sol at the
          # Solidity 0.8.26 pragma. OZ v5.0.2 supports pragma ^0.8.20 and
          # covers those import paths. `--no-git` keeps the install
          # aligned with the same install-at-CI-time pattern as forge-std.
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git

      - name: forge build (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          forge build
          ls -l out/

      - name: forge test (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          OUT="$GITHUB_WORKSPACE/ci-out/${{ matrix.case }}-${{ matrix.leg }}.out"
          forge test -vv 2>&1 | tee "$OUT"
          rc=${PIPESTATUS[0]}
          set -e
          MARKER_COUNT=$(grep -c -E 'INVARIANT VIOLATED' "$OUT" || true)
          if [ "${{ matrix.leg }}" = "planted" ]; then
            # Planted: rc != 0 AND marker present. Either condition
            # missing means the planted bug failed to surface or
            # forge's exit-code contract changed.
            if [ "$MARKER_COUNT" -ge 1 ] && [ "$rc" -ne 0 ]; then
              echo "::notice::${{ matrix.case }} planted leg fired as expected (rc=${rc}, markers=${MARKER_COUNT})."
              exit 0
            fi
            echo "::error::${{ matrix.case }} planted leg regressed (rc=${rc}, markers=${MARKER_COUNT}); expected rc!=0 AND markers>=1."
            exit 1
          else
            # Clean: rc == 0 AND zero markers.
            if [ "$MARKER_COUNT" -eq 0 ] && [ "$rc" -eq 0 ]; then
              echo "::notice::${{ matrix.case }} clean leg holds (rc=0, 0 markers)."
              exit 0
            fi
            echo "::error::${{ matrix.case }} clean leg failed (rc=${rc}, markers=${MARKER_COUNT}); expected rc==0 AND markers==0."
            exit 1
          fi

      - name: Upload forge raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-out-${{ matrix.case }}-${{ matrix.leg }}
          path: ci-out/${{ matrix.case }}-${{ matrix.leg }}.out

  v4-hooks-cases:
    # Uniswap v4 hook-class invariants. Same paired-leg pattern as
    # evm-cases above (clean: rc==0 AND zero markers; planted: rc!=0
    # AND markers>=1) — the v4-hooks planted suite has 3 unit tests
    # that pass alongside 6 invariant+attack tests that fail with
    # the INVARIANT VIOLATED marker, so the suite-level rule still
    # holds. Lives outside the cases/ matrix because v4-hooks/ is a
    # subdir-scoped lane (Uniswap Foundation Security grant track),
    # not a numbered Atlas case.
    #
    # Foundry pinned to v1.7.1 here — the exact toolchain on which
    # scorecard.clean.md (9 pass / 0 fail) and scorecard.planted.md
    # (3 pass / 6 fail, all six carrying INVARIANT VIOLATED) were
    # captured. The shared setup-foundry composite tracks `stable`
    # for cases 06+; v4-hooks holds to the scorecard pin so the live
    # badge stays a faithful re-verification of the published
    # scorecard rather than a moving-target stable-channel claim.
    name: Atlas v4-hooks — ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        leg:
          - clean
          - planted
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry (v1.7.1, scorecard pin)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Verify forge on PATH
        run: |
          forge --version
          cast --version

      - name: Install forge-std (${{ env.FORGE_STD_VERSION }})
        working-directory: v4-hooks/${{ matrix.leg }}
        run: |
          # Same `--no-git` install convention as the cases/ EVM jobs;
          # the leg dir is not its own git root.
          forge install foundry-rs/forge-std@${{ env.FORGE_STD_VERSION }} --no-git

      - name: forge build (v4-hooks / ${{ matrix.leg }})
        working-directory: v4-hooks/${{ matrix.leg }}
        run: |
          forge build
          ls -l out/

      - name: forge test (v4-hooks / ${{ matrix.leg }})
        working-directory: v4-hooks/${{ matrix.leg }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          OUT="$GITHUB_WORKSPACE/ci-out/v4-hooks-${{ matrix.leg }}.out"
          forge test -vv 2>&1 | tee "$OUT"
          rc=${PIPESTATUS[0]}
          set -e
          MARKER_COUNT=$(grep -c -E 'INVARIANT VIOLATED' "$OUT" || true)
          if [ "${{ matrix.leg }}" = "planted" ]; then
            # Planted: rc != 0 AND marker present. Scorecard says 6/9
            # tests fail and each failure carries the marker; the 3
            # unit tests pass alongside them but the suite-level rc
            # is still non-zero, which is what we check here.
            if [ "$MARKER_COUNT" -ge 1 ] && [ "$rc" -ne 0 ]; then
              echo "::notice::v4-hooks planted leg fired as expected (rc=${rc}, markers=${MARKER_COUNT})."
              exit 0
            fi
            echo "::error::v4-hooks planted leg regressed (rc=${rc}, markers=${MARKER_COUNT}); expected rc!=0 AND markers>=1."
            exit 1
          else
            # Clean: rc == 0 AND zero markers.
            if [ "$MARKER_COUNT" -eq 0 ] && [ "$rc" -eq 0 ]; then
              echo "::notice::v4-hooks clean leg holds (rc=0, 0 markers)."
              exit 0
            fi
            echo "::error::v4-hooks clean leg failed (rc=${rc}, markers=${MARKER_COUNT}); expected rc==0 AND markers==0."
            exit 1
          fi

      - name: Upload forge raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-out-v4-hooks-${{ matrix.leg }}
          path: ci-out/v4-hooks-${{ matrix.leg }}.out

  taiko-cases:
    # Taiko Type-1 Ethereum-equivalence twins. Same paired-leg pattern
    # as evm-cases / v4-hooks-cases above (clean: rc==0 AND zero markers;
    # planted: rc!=0 AND markers>=1). The taiko planted suite has 1 test
    # that passes (warm-SLOAD — only the cold-SLOAD constant was mutated,
    # demonstrating single-localized-hunk discipline) alongside 5 that
    # fail with the INVARIANT VIOLATED marker, so the suite-level rule
    # still holds. Lives outside the cases/ matrix because taiko/ is a
    # subdir-scoped lane (Taiko Labs grant track), not a numbered Atlas
    # case.
    #
    # Foundry pinned to v1.7.1 here — same pin as v4-hooks-cases. The
    # §4b code-quality review (2026-06-28) was captured on this toolchain
    # (6/6 clean, 1/5 planted with markers); the pin keeps the live badge
    # a faithful re-verification of the §4b receipt rather than a
    # moving-target stable-channel claim. Shared setup-foundry composite
    # for cases 06+ stays on `stable`.
    name: Atlas taiko — ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        leg:
          - clean
          - planted
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry (v1.7.1, scorecard pin)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Verify forge on PATH
        run: |
          forge --version
          cast --version

      - name: Install forge-std (${{ env.FORGE_STD_VERSION }})
        working-directory: taiko/${{ matrix.leg }}
        run: |
          # Same `--no-git` install convention as the cases/ EVM jobs;
          # the leg dir is not its own git root.
          forge install foundry-rs/forge-std@${{ env.FORGE_STD_VERSION }} --no-git

      - name: forge build (taiko / ${{ matrix.leg }})
        working-directory: taiko/${{ matrix.leg }}
        run: |
          forge build
          ls -l out/

      - name: forge test (taiko / ${{ matrix.leg }})
        working-directory: taiko/${{ matrix.leg }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          OUT="$GITHUB_WORKSPACE/ci-out/taiko-${{ matrix.leg }}.out"
          forge test -vv 2>&1 | tee "$OUT"
          rc=${PIPESTATUS[0]}
          set -e
          MARKER_COUNT=$(grep -c -E 'INVARIANT VIOLATED' "$OUT" || true)
          if [ "${{ matrix.leg }}" = "planted" ]; then
            # Planted: rc != 0 AND marker present. §4b receipt says 5/6
            # tests fail and each failure carries the marker; the warm-
            # SLOAD test passes alongside them (single-hunk discipline —
            # only cold SLOAD was mutated) but the suite-level rc is
            # still non-zero, which is what we check here.
            if [ "$MARKER_COUNT" -ge 1 ] && [ "$rc" -ne 0 ]; then
              echo "::notice::taiko planted leg fired as expected (rc=${rc}, markers=${MARKER_COUNT})."
              exit 0
            fi
            echo "::error::taiko planted leg regressed (rc=${rc}, markers=${MARKER_COUNT}); expected rc!=0 AND markers>=1."
            exit 1
          else
            # Clean: rc == 0 AND zero markers.
            if [ "$MARKER_COUNT" -eq 0 ] && [ "$rc" -eq 0 ]; then
              echo "::notice::taiko clean leg holds (rc=0, 0 markers)."
              exit 0
            fi
            echo "::error::taiko clean leg failed (rc=${rc}, markers=${MARKER_COUNT}); expected rc==0 AND markers==0."
            exit 1
          fi

      - name: Upload forge raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-out-taiko-${{ matrix.leg }}
          path: ci-out/taiko-${{ matrix.leg }}.out

  solana-cases:
    name: Atlas case (Solana) — ${{ matrix.case }} / ${{ matrix.leg }}
    runs-on: ubuntu-latest
    # Anchor-lang + its solana-* transitive crates pull in a wide
    # dep tree; the cold first build is the slow path (~3 min on
    # a free-tier runner). 35 min gives headroom; the cache hits on
    # second-and-later runs cut this to <2 min.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Every Solana case lists itself here. Case 5 (Loopscale) is
        # the Solana template-setter for the Atlas; case 3 (Cashio)
        # and case 4 (Mango) append here as they ship. Cases 3-4
        # extend setup-solana inline if their invariant class needs
        # the full Crucible / LiteSVM rail (cargo-build-sbf + Anza
        # Solana CLI + sibling crucible clone); case 4 (Mango) and
        # case 5 (Loopscale) both use the lighter pure-Rust rail —
        # see each case's README for the per-case toolchain
        # rationale.
        case:
          - 04-solana-mango
          - 05-solana-loopscale
        leg:
          - clean
          - planted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-solana
        with:
          rust-version: ${{ env.RUST_VERSION }}

      - name: cargo build --release (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          cargo build --release
          ls -l target/release/

      - name: cargo test --release (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          OUT="$GITHUB_WORKSPACE/ci-out/${{ matrix.case }}-${{ matrix.leg }}.out"
          cargo test --release 2>&1 | tee "$OUT"
          rc=${PIPESTATUS[0]}
          set -e
          MARKER_COUNT=$(grep -c -E 'INVARIANT VIOLATED' "$OUT" || true)
          if [ "${{ matrix.leg }}" = "planted" ]; then
            # Planted: rc != 0 AND marker present. Either condition
            # missing means the planted bug failed to surface or
            # cargo's exit-code contract changed.
            if [ "$MARKER_COUNT" -ge 1 ] && [ "$rc" -ne 0 ]; then
              echo "::notice::${{ matrix.case }} planted leg fired as expected (rc=${rc}, markers=${MARKER_COUNT})."
              exit 0
            fi
            echo "::error::${{ matrix.case }} planted leg regressed (rc=${rc}, markers=${MARKER_COUNT}); expected rc!=0 AND markers>=1."
            exit 1
          else
            # Clean: rc == 0 AND zero markers.
            if [ "$MARKER_COUNT" -eq 0 ] && [ "$rc" -eq 0 ]; then
              echo "::notice::${{ matrix.case }} clean leg holds (rc=0, 0 markers)."
              exit 0
            fi
            echo "::error::${{ matrix.case }} clean leg failed (rc=${rc}, markers=${MARKER_COUNT}); expected rc==0 AND markers==0."
            exit 1
          fi

      - name: Upload cargo test raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-out-${{ matrix.case }}-${{ matrix.leg }}
          path: ci-out/${{ matrix.case }}-${{ matrix.leg }}.out

  solana-bpf-cases:
    name: Atlas case (Solana / BPF rail) — ${{ matrix.case }} / ${{ matrix.leg }}
    runs-on: ubuntu-latest
    # cargo-build-sbf compile + the LiteSVM test stack is heavier than
    # the pure-Rust rail; 45 min covers a cold first-run with no cache.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Solana cases whose invariant class needs the actual on-chain
        # account-validation behavior — they compile the Anchor program
        # to BPF via cargo-build-sbf and load the .so into LiteSVM at
        # test time. Case 3 (Cashio) is the load-bearing example: the
        # bug class IS Anchor's `Accounts` macro constraint-check
        # behavior, which is only faithfully exercised through the
        # actual program-runtime dispatch.
        case:
          - 03-solana-cashio
        leg:
          - clean
          - planted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-solana-bpf
        with:
          solana-version: '4.2.2'

      - name: cargo build-sbf (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          cargo build-sbf --manifest-path programs/cashio-mint/Cargo.toml
          ls -l target/deploy/

      - name: cargo test (${{ matrix.case }} / ${{ matrix.leg }})
        working-directory: cases/${{ matrix.case }}/${{ matrix.leg }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/ci-out"
          OUT="$GITHUB_WORKSPACE/ci-out/${{ matrix.case }}-${{ matrix.leg }}.out"
          cargo test --manifest-path tests/Cargo.toml -- --nocapture 2>&1 | tee "$OUT"
          rc=${PIPESTATUS[0]}
          set -e
          MARKER_COUNT=$(grep -c -E 'INVARIANT VIOLATED' "$OUT" || true)
          if [ "${{ matrix.leg }}" = "planted" ]; then
            # Planted: rc != 0 AND marker present.
            if [ "$MARKER_COUNT" -ge 1 ] && [ "$rc" -ne 0 ]; then
              echo "::notice::${{ matrix.case }} planted leg fired as expected (rc=${rc}, markers=${MARKER_COUNT})."
              exit 0
            fi
            echo "::error::${{ matrix.case }} planted leg regressed (rc=${rc}, markers=${MARKER_COUNT}); expected rc!=0 AND markers>=1."
            exit 1
          else
            # Clean: rc == 0 AND zero markers.
            if [ "$MARKER_COUNT" -eq 0 ] && [ "$rc" -eq 0 ]; then
              echo "::notice::${{ matrix.case }} clean leg holds (rc=0, 0 markers)."
              exit 0
            fi
            echo "::error::${{ matrix.case }} clean leg failed (rc=${rc}, markers=${MARKER_COUNT}); expected rc==0 AND markers==0."
            exit 1
          fi

      - name: Upload cargo test raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-sbf-out-${{ matrix.case }}-${{ matrix.leg }}
          path: ci-out/${{ matrix.case }}-${{ matrix.leg }}.out

  # Phase 2 - multi-seed reachability certification (standing merge gate).
  # For every EVM planted case in the Atlas, the planted twin must FAIL with
  # an INVARIANT VIOLATED marker on ALL 16 canonical seeds in
  # ci/reachability_seeds.txt. Turns the per-case matrix's one-seed catches
  # into a deterministic N-of-N certification per case. Non-EVM cases (Cairo,
  # Move, Solana) are NOT covered by this leg; per-ecosystem reachability
  # harnesses are queued separately (see docs/reachability.md).
  evm-cases-reachability-multi-seed:
    name: Atlas reachability (EVM) - ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # EVM planted twins by dir + label. Case 8 also installs OZ v5.0.2
        # via the same install-at-CI-time pattern used by evm-cases above.
        include:
          - case: 06-evm-access-control
            case_dir: cases/06-evm-access-control/planted
            label: case-06 access-control
            install_oz: false
          - case: 08-evm-ethena-timelock-selector
            case_dir: cases/08-evm-ethena-timelock-selector/planted
            label: case-08 ethena-timelock-selector
            install_oz: true
          - case: v4-hooks
            case_dir: v4-hooks/planted
            label: v4-hooks
            install_oz: false
          - case: taiko
            case_dir: taiko/planted
            label: taiko
            install_oz: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-foundry
        with:
          forge-std-version: ${{ env.FORGE_STD_VERSION }}

      - name: Install forge-std (${{ env.FORGE_STD_VERSION }})
        working-directory: ${{ matrix.case_dir }}
        run: |
          forge install foundry-rs/forge-std@${{ env.FORGE_STD_VERSION }} --no-git

      - name: Install openzeppelin-contracts v5.0.2 (case 8 only)
        if: matrix.install_oz == true
        working-directory: ${{ matrix.case_dir }}
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git

      - name: forge build (${{ matrix.case }})
        working-directory: ${{ matrix.case_dir }}
        run: forge build

      - name: Reachability certified across 16 seeds
        run: ./ci/reachability_leg.sh --case-dir "${{ matrix.case_dir }}" --label "${{ matrix.label }}"
