# Atlas v4-hooks subdir, CLEAN twin Foundry config.
#
# Shared toolchain config across v4-hooks/clean/ and v4-hooks/planted/;
# the line-1 CLEAN/PLANTED label above is the only header difference.
# Only the three hook source files under src/ differ between the twins;
# the test surface does not change.
#
# Same shape as cases/07 foundry.toml: solc 0.8.28, forge-std v1.9.4
# (symlinked in lib/ from case 07 for offline reproducibility),
# invariant runner sized for a CI-friendly campaign.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "forge-std/=lib/forge-std/src/",
]

ffi = false
gas_limit = 9223372036854775807
memory_limit = 2147483648

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 50
fail_on_revert = false
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true
